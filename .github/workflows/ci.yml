name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      # Report both apps even if one of them fails
      fail-fast: false
      matrix:
        app: [server, client]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # The server's tests download a MongoDB binary for mongodb-memory-server on first run
      - run: npm test

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Builds every stage, so a broken Dockerfile or build step fails CI. Nothing is pushed.
      - run: docker build --tag task-manager .
